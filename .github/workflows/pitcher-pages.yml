name: Build pitcher pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitcher-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the image library
        run: pip install pillow

      - name: Build a page and a preview image for every pitcher
        run: python3 build/build_pages.py

      - name: Save the pages to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add p og sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Build pitcher pages"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
