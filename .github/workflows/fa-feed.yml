name: Update free agency feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MLB transactions
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          end = (datetime.date.today() + datetime.timedelta(days=1)).isoformat()
          url = ("https://statsapi.mlb.com/api/v1/transactions"
                 f"?sportId=1&startDate=2026-10-28&endDate={end}")
          req = urllib.request.Request(url, headers={"User-Agent": "kafkaesque-baseball"})
          data = json.load(urllib.request.urlopen(req, timeout=60))
          keep = []
          for t in data.get("transactions", []):
              person = t.get("person") or {}
              if not person.get("id"):
                  continue
              team = lambda k: {"name": (t.get(k) or {}).get("name", "")} if t.get(k) else None
              keep.append({"person": {"id": person["id"]},
                           "typeDesc": t.get("typeDesc", ""),
                           "description": t.get("description", ""),
                           "date": t.get("date", ""),
                           "effectiveDate": t.get("effectiveDate", ""),
                           "toTeam": team("toTeam"),
                           "fromTeam": team("fromTeam")})
          old = None
          if os.path.exists("fa_transactions.json"):
              old = json.load(open("fa_transactions.json")).get("transactions")
          if old != keep:
              now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ")
              json.dump({"updated": now, "transactions": keep},
                        open("fa_transactions.json", "w"), separators=(",", ":"))
          print(len(keep), "transactions")
          PY

      - name: Save it to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fa_transactions.json
          git diff --staged --quiet || (git commit -m "Update free agency feed" && git push)
